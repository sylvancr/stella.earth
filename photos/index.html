<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Photos — Stella Matutina</title>
<style>
  @font-face {
    font-family: 'Tofth Grotesk Mono';
    src: url('../assets/Tofth-Grotesk-Mono.ttf') format('truetype');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Tofth Grotesk Semi Mono';
    src: url('../assets/Tofth-Grotesk-Semi-Mono-Negative-Tracking.ttf') format('truetype');
    font-weight: 400;
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #000;
    font-family: 'Tofth Grotesk Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============ BLURRED BACKGROUND ============ */
  .bg-stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #000;
    overflow: hidden;
  }
  .bg-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: blur(22px);
    transform: scale(1.08);
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .bg-stage img.loaded { opacity: 1; }
  .bg-stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.52);
  }

  /* ============ TOP-LEFT CORNER ============ */
  .corner {
    position: fixed;
    top: 38px;
    left: 42px;
    z-index: 3;
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fade 1.2s ease 0.1s both;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .corner .title {
    font-family: 'Tofth Grotesk Semi Mono', 'Tofth Grotesk Mono', monospace;
    font-size: 28px;
    letter-spacing: 0.02em;
    line-height: 1.05;
    font-weight: 400;
    text-shadow: 0 1px 14px rgba(0,0,0,0.5);
    text-decoration: none;
    color: #fff;
  }
  .corner .place {
    font-family: 'Tofth Grotesk Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 12px rgba(0,0,0,0.5);
  }
  .corner .nav-link {
    margin-top: 18px;
    background: transparent;
    border: none;
    padding: 0;
    color: #fff;
    cursor: pointer;
    font-family: 'Tofth Grotesk Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    opacity: 0.9;
    transition: opacity 0.2s ease, gap 0.25s ease;
    text-shadow: 0 1px 12px rgba(0,0,0,0.5);
  }
  .corner .nav-link::after {
    content: '';
    width: 22px;
    height: 1px;
    background: rgba(255,255,255,0.75);
    transition: width 0.25s ease;
  }
  .corner .nav-link:hover { opacity: 1; gap: 16px; }
  .corner .nav-link:hover::after { width: 32px; }

  /* ============ PHOTO STACK ============ */
  .photos {
    position: relative;
    z-index: 1;
    padding: 140px 40px 100px;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: fade 1.2s ease 0.3s both;
  }

  .photo-item {
    cursor: pointer;
    overflow: hidden;
    border-radius: 10px;
    position: relative;
    background: rgba(255,255,255,0.05);
  }
  .photo-item img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.4s ease;
  }
  .photo-item img.loaded { opacity: 1; }
  .photo-item:hover img { transform: scale(1.015); }

  /* ============ LIGHTBOX ============ */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }

  .lb-img-wrap {
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 6px;
    user-select: none;
    display: block;
  }

  .lightbox-close {
    position: fixed;
    top: 22px;
    right: 26px;
    background: none;
    border: none;
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
    font-family: 'Tofth Grotesk Mono', monospace;
    text-shadow: 0 0 12px rgba(0,0,0,0.7);
    z-index: 21;
  }
  .lightbox-close:hover { opacity: 1; }

  .lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #fff;
    font-size: 36px;
    line-height: 1;
    cursor: pointer;
    padding: 20px 16px;
    transition: opacity 0.2s;
    z-index: 21;
  }
  .lightbox-nav.prev { left: 8px; }
  .lightbox-nav.next { right: 8px; }
  .lightbox-nav:disabled { opacity: 0.2; cursor: default; }
  .lightbox-nav:not(:disabled):hover { opacity: 0.8; }
  .lightbox-nav { opacity: 0.55; }

  .lightbox-counter {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    z-index: 21;
    white-space: nowrap;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 600px) {
    .corner { top: 24px; left: 22px; }
    .corner .title { font-size: 22px; }
    .corner .place { font-size: 11px; }
    .photos { padding: 120px 16px 80px; gap: 14px; }
    .lightbox-nav { font-size: 28px; padding: 14px 10px; }
  }
</style>
<script data-goatcounter="https://stellaearth.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<!-- Blurred aerial background -->
<div class="bg-stage" aria-hidden="true">
  <img id="bgImg" src="../assets/bw-aerial.jpg" alt="" decoding="async" fetchpriority="high" />
</div>

<!-- Top-left corner -->
<div class="corner">
  <a href="/" class="title">Stella Matutina</a>
  <div class="place">Lake Lucerne, Switzerland</div>
  <a href="/" class="nav-link">Home</a>
</div>

<!-- Stacked photos -->
<div class="photos" id="photoGrid">
  <div class="photo-item" data-index="0">
    <img src="assets/photo-5.jpg" alt="Garden with lake view" loading="eager" decoding="async" />
  </div>
  <div class="photo-item" data-index="1">
    <img src="assets/photo-3.jpg" alt="Exterior, summer" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="2">
    <img src="assets/photo-2.jpg" alt="Exterior, winter morning" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="3">
    <img src="assets/photo-1.jpg" alt="Corridor with arched ceiling" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="4">
    <img src="assets/photo-4.jpg" alt="Exterior from hillside" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="5">
    <img src="assets/photo-6.jpg" alt="Greenhouses" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="6">
    <img src="assets/photo-7.jpg" alt="Chapel interior" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="7">
    <img src="assets/photo-8.jpg" alt="Chapel with tall window" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="8">
    <img src="assets/photo-9.jpg" alt="Morning landscape path" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="9">
    <img src="../assets/desk-view.jpg" alt="Desk with lake view" loading="lazy" decoding="async" />
  </div>
  <div class="photo-item" data-index="10">
    <img src="../assets/bw-aerial.jpg" alt="Aerial view of Lake Lucerne peninsula" loading="lazy" decoding="async" />
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lbClose" aria-label="Close">×</button>
  <button class="lightbox-nav prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <div class="lb-img-wrap">
    <img id="lbImg" src="" alt="" />
  </div>
  <button class="lightbox-nav next" id="lbNext" aria-label="Next photo">›</button>
  <div class="lightbox-counter" id="lbCounter"></div>
</div>

<script>
  // Background fade-in
  (function(){
    var bg = document.getElementById('bgImg');
    function show(){ bg.classList.add('loaded'); }
    if (bg.complete && bg.naturalWidth > 0) requestAnimationFrame(show);
    else if (bg.decode) bg.decode().then(show).catch(function(){ bg.addEventListener('load', show, {once:true}); });
    else bg.addEventListener('load', show, {once:true});
  })();

  // Photo fade-in on load
  document.querySelectorAll('.photo-item img').forEach(function(img){
    function onLoad(){ img.classList.add('loaded'); }
    if (img.complete && img.naturalWidth > 0) requestAnimationFrame(onLoad);
    else img.addEventListener('load', onLoad, {once:true});
  });

  // Lightbox
  var items   = Array.from(document.querySelectorAll('.photo-item'));
  var srcs    = items.map(function(el){ return el.querySelector('img').src; });
  var alts    = items.map(function(el){ return el.querySelector('img').alt; });
  var current = 0;

  var lightbox  = document.getElementById('lightbox');
  var lbImg     = document.getElementById('lbImg');
  var lbClose   = document.getElementById('lbClose');
  var lbPrev    = document.getElementById('lbPrev');
  var lbNext    = document.getElementById('lbNext');
  var lbCounter = document.getElementById('lbCounter');

  function updateNav(){
    lbPrev.disabled = current === 0;
    lbNext.disabled = current === srcs.length - 1;
    lbCounter.textContent = (current + 1) + ' / ' + srcs.length;
  }
  function showPhoto(){
    lbImg.src  = srcs[current];
    lbImg.alt  = alts[current];
    updateNav();
  }
  function openLightbox(i){
    current = i;
    showPhoto();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function prev(){ if (current > 0){ current--; showPhoto(); } }
  function next(){ if (current < srcs.length - 1){ current++; showPhoto(); } }

  items.forEach(function(item){
    item.addEventListener('click', function(){ openLightbox(parseInt(item.dataset.index)); });
  });

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', prev);
  lbNext.addEventListener('click', next);
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox || e.target.classList.contains('lb-img-wrap')) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')   prev();
    if (e.key === 'ArrowRight')  next();
  });
</script>
</body>
</html>
